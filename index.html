<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA Robot Monitoring System</title>
    <link rel="stylesheet" href="style.css">  
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">N</div>
      <div>
        <h1>NETRA</h1>
        <p>ROBOT MISSION CONTROL</p>
      </div>
    </div>
    
    <nav>
      <a href="#dashboard" class="active">Dashboard</a>
      <a href="#fleet">Fleet</a>
      <a href="#telemetry">Telemetry</a>
      <a href="#alerts">Alerts</a>
    </nav>
    
    <div class="header-right">
      <div class="status-group">
        <span class="online-dot"></span>
        <span class="status-text">SYSTEM ONLINE</span>
        <strong id="clock">--:--:--</strong>
      </div>
      <button id="dispatch-open" type="button">+ Dispatch Mission</button>
    </div>
  </header>

  <main id="dashboard" class="dashboard-container">
    <div class="stat-card">
      <span class="card-title">ROVERS ONLINE</span>
      <div class="card-value">6 / 6</div>
      <p class="card-subtitle">Active rover units</p>
    </div>
  </main>

  <script src="script.js"></script>  
</body>
</html>
